version: "3.9"
services:
  web:
    build: .
    ports:
      - "5025:5025"
    depends_on:
      - redis
    env_file:
      - '.env'
    container_name: notification-web
  redis:
    hostname: redis
    image: "redis:alpine"
    ports:
      - "6379:6379"
    container_name: notification-redis
  mailhog:
    hostname: mailhog
    image: "mailhog/mailhog"
    ports:
      - "1025:1025"
      - "8025:8025"
    container_name: notification-mail
  flower:
    image: mher/flower
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=8888
    ports:
      - 8888:8888
    depends_on:
      - redis
    container_name: notification-flower